<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>纸间小铺 · 原创帮助中心练习</title>
<style>body{max-width:820px;margin:60px auto;padding:24px;background:#f6f1e8;color:#27251e;font:18px/1.8 system-ui,sans-serif}h1{font-size:42px}article{border-top:1px solid #b8a78a;padding:20px 0}small{color:#6b6358}</style>
<header><small>RepoGo 原创虚构帮助内容</small><h1>取货前，先看这三件事。</h1><p>把动态加载的帮助内容整理成一份可保留的 Markdown 文档。</p></header>
<main id="articles" data-state="loading"><p>帮助条目加载中……</p></main>
<footer><p>仅为本地内容导出练习，不是商家的服务承诺。</p></footer>
<script>
fetch('/help.json').then(response=>response.json()).then(rows=>{
  const root=document.querySelector('#articles');root.replaceChildren();
  for(const row of rows){const item=document.createElement('article');const heading=document.createElement('h2');const text=document.createElement('p');heading.textContent=row.title;text.textContent=row.answer;item.append(heading,text);root.append(item)}
  root.dataset.state='ready';
}).catch(()=>{document.querySelector('#articles').textContent='加载失败，请检查 help.json。'});
</script></html>
